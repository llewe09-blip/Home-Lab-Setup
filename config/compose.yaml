services:
  # --- DNS & Ad-Blocking ---
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    networks:
      home_net:
        ipv4_address: 10.2.0.100  # Static IP within Docker network
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8080:80/tcp"             # Admin Interface
    environment:
      TZ: 'America/New_York'
      WEBPASSWORD: 'your_secure_password_here' # REPLACED: Use a placeholder
      FTLCONF_LOCAL_IPV4: 10.2.0.100
    volumes:
      - './etc-pihole:/etc/pihole'
      - './etc-dnsmasq.d:/etc/dnsmasq.d'
    restart: unless-stopped

  # --- Secure Remote Access ---
  wireguard:
    container_name: wireguard
    image: wg-easy/wg-easy:latest
    networks:
      home_net:
        ipv4_address: 10.2.0.2
    ports:
      - "51820:51820/udp"
      - "51821:51821/tcp"         # Web UI
    environment:
      - WG_HOST=your.dynamic-dns.com           # REPLACED: Use your public IP or DDNS
      - PASSWORD=your_admin_password_here      # REPLACED: Placeholder
      - WG_DEFAULT_DNS=10.2.0.100              # Pointing to Pi-hole for VPN ads
    volumes:
      - './etc-wireguard:/etc/wireguard'
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1

networks:
  home_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.2.0.0/24